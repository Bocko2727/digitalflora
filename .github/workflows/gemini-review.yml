name: Analyze herbarium review images

on:
  push:
    paths:
      - 'images/review/**'
      - 'scripts/analyze_review.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze pending images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze_review.py
      - name: Save review results
        run: |
          git config user.name 'digitalflora-bot'
          git config user.email 'digitalflora-bot@users.noreply.github.com'
          git add data/review-results.json
          git diff --cached --quiet || git commit -m 'chore: update image review results'
          git push
