<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Флора — проверен ботанически каталог</title>
  <style>
    :root{--green:#285c38;--paper:#fbf8f1;--ink:#1c2a20;--muted:#5e6b61;--line:#d8d1c3;--warn:#8a4c00}
    *{box-sizing:border-box} body{margin:0;background:#edf1eb;color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
    header{background:var(--green);color:#fff;padding:24px max(20px,calc((100vw - 1180px)/2));box-shadow:0 2px 8px #0002}
    h1{font:700 30px Georgia,serif;margin:0} header p{margin:4px 0 0;opacity:.9}
    main{max-width:1180px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:280px 1fr;gap:24px}
    aside,.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #23331b12}
    aside{padding:14px;height:max-content;position:sticky;top:18px}.filter{width:100%;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.filter:hover,.filter.active{background:#dcebdc;color:#174425;font-weight:700}
    .card{overflow:hidden}.hero{display:grid;grid-template-columns:minmax(250px,42%) 1fr}.hero img{width:100%;height:430px;object-fit:cover;background:#d9dfd8}.content{padding:28px}.code{font-size:12px;letter-spacing:.1em;color:var(--green);font-weight:800}.latin{font:italic 21px Georgia,serif;color:var(--green);margin:5px 0 16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-block:1px solid var(--line);padding:12px 0;margin-bottom:16px;font-size:14px}.meta b{display:block;color:var(--muted);font-size:12px}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:#edf4ed;color:#245d36}.probable{background:#fff0d9;color:var(--warn)}.unverified{background:#fde3e3;color:#8a2626}
    h2{font:700 31px Georgia,serif;margin:5px 0} h3{font:700 18px Georgia,serif;margin:20px 0 6px;color:var(--green)} p{margin:6px 0}.note{margin-top:18px;padding:12px 14px;background:#fff3dc;border-left:4px solid #d88b18;border-radius:7px;font-size:14px}.sources{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
    .empty{padding:35px;text-align:center;color:var(--muted)} @media(max-width:800px){main{grid-template-columns:1fr}aside{position:static}.hero{grid-template-columns:1fr}.hero img{height:340px}.content{padding:20px}}
  </style>
</head>

let current=0;
const statusClass=s=>s.startsWith('Потвърдено')?'badge':s.startsWith('Неопределимо')?'badge unverified':'badge probable';
function renderList(){document.getElementById('list').innerHTML=plants.map((p,i)=>`<button class="filter ${i===current?'active':''}" onclick="selectPlant(${i})">${String(i+1).padStart(2,'0')}. ${p.name}<br><small>${p.img}</small></button>`).join('')}
function selectPlant(i){current=i;renderList();renderPlant()}
function renderPlant(){const p=plants[current];document.getElementById('view').innerHTML=`<article class="hero"><img src="${p.img}" alt="${p.name} — ${p.img}"><div class="content"><div class="code">ОБРАЗЕЦ ${String(current+1).padStart(3,'0')} · ${p.img}</div><h2>${p.name}</h2><div class="latin">${p.latin}</div><span class="${statusClass(p.status)}">${p.status}</span><div class="meta"><div><b>Семейство</b>${p.family}</div><div><b>Статус</b>${p.type}</div></div><h3>Разпознаване</h3><p>${p.r}</p><p><b>Възможни двойници:</b> ${p.d}</p><h3>Ползи</h3><p>${p.b}</p><h3>Рискове</h3><p>${p.risk}</p><h3>Употреби</h3><p>${p.u}</p><h3>Любопитен факт</h3><p>${p.f}</p><div class="note"><b>Забележка за точност:</b> „Вероятно“ и „Неопределимо“ означават, че снимката не показва всички нужни диагностични белези. При тези записи не е безопасно да се твърди видова идентификация, ядливост или лечебна употреба.</div><div class="sources"><b>Източници:</b> ${common}</div></div></article>`}
renderList();renderPlant();
</script>
