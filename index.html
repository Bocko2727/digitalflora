</style></head><body><header><h1>Дигитален ботанически хербарий</h1><p>Подробни профили с ясно означена сигурност на определянето</p></header><main><aside><strong>Каталог</strong><div id="list"></div></aside><section id="view" class="card"></section></main><script>
const src='Таксономия: Plants of the World Online (Royal Botanic Gardens, Kew); разпространение: проверка чрез български флористични източници; рискове: ветеринарни/токсикологични източници при нужда. Снимковото определяне не е основание за консумация или самолечение.';
const P=[
['Лютиче','Ranunculus sp.','Лютикови (Ranunculaceae)',['IMG_1759.jpg'],'Вероятно — до род','Лъскав жълт цвят с пет венчелистчета и много тичинки. Листата и плодчетата не се виждат, затова видът не се фиксира.','Влажни ливади и тревни места; родът е широко разпространен в България.','Други жълтоцветни лютичета (Ranunculus).','Цветовете предоставят прашец и нектар и участват в ливадното биоразнообразие.','Пресните растения могат да образуват протоанемонин и да дразнят кожа, уста и храносмилателен тракт; не са за храна или самолечение.','Историческите външни приложения не са безопасна препоръка.','Лъскавостта на венчелистчетата се дължи на специфична клетъчна структура.'],
['Прегоряла орхидея','Neotinea ustulata','Орхидеи (Orchidaceae)',['IMG_1766.jpg'],'Вероятно','Компактно яйцевидно съцветие с тъмни „прегорели“ връхни пъпки и дребни розово-пурпурни цветове; виждат се приосновни листа.','Ливади и открити места; видът е европейски и е представен в България.','Други ливадни орхидеи, особено Orchis и Anacamptis.','Свързана е със специализирани почвени гъби и опрашители; индикатор е за ценни ливадни екосистеми.','Не се бере и не се изкопава. Няма безопасна домашна лечебна или хранителна употреба.','Научна, природозащитна и фотографска стойност.','Семената на орхидеите почти нямат хранителен запас и при покълване зависят от гъби.'],
['Теснолистна върбовка','Epilobium angustifolium','Върбовкови (Onagraceae)',['IMG_2214.jpg','IMG_5641.jpg'],'Потвърдено с висока вероятност','Високи стъбла, тесни ланцетни листа и дълги гроздове от пурпурнорозови четирилистни цветове.','Сечища, горски окрайнини, пожарища и открити нарушени терени; разпространена е в България.','Други върбовки; мащабното съцветие и тесните листа са характерни.','Нектароносен вид за пчели и други насекоми; бързо възстановява растителността на нарушени места.','Няма достатъчно качествени клинични данни за лечебна употреба; не замества медицинско лечение.','Младите леторасти и листата имат традиционни кулинарни и чайни употреби, но това не е клинична препоръка.','Често е сред първите масово цъфтящи видове след пожар или сеч.'],
['Алпийски еделвайс','Leontopodium nivale subsp. alpinum','Сложноцветни (Asteraceae)',['IMG_2372.jpg','IMG_2373.jpg'],'Вероятно','Сребристо-влакнеста розетка и мъхесто звездовидно съцветие с жълтеникави центрове.','Високопланински скалисти и тревни местообитания; видът е местен за европейските планини, включително България.','Други беловлакнести сложноцветни.','Част от високопланинското биоразнообразие и ресурс за насекоми.','Не събирай диви екземпляри; няма утвърдена клинична лечебна употреба.','Декоративен вид за алпинеуми само от разсадников произход.','Власинките ограничават загубата на вода и защитават от студ и UV радиация.'],
['Пластинеста гъба с пръстен','Неидентифицирана гъба','Гъби',['IMG_3284.jpg'],'Неопределимо','Светлокафява шапка, тъмни пластинки, пънче и пръстен; липсват ключови белези.','Расте в почва и листна постеля.','Множество ядливи и опасни пластинести гъби.','Гъбите разграждат органична материя и участват в почвените процеси.','НЕ КОНСУМИРАЙ. Един кадър не показва основата, спорите, миризмата и други определителни белези.','Само фотографско наблюдение.','Видимата гъба е плодното тяло; основната част на организма е мицелът.'],
['Жълт минзухар','Crocus sp.','Перуникови (Iridaceae)',['IMG_4387.jpg'],'Вероятно — до род','Яркожълт бокаловиден цвят с шест околоцветни дяла.','Родът Crocus е представен в България; точният вид не се установява от този кадър.','Други Crocus; важно е разграничаването от Colchicum (мразовец).','Ранният цъфтеж може да осигури прашец на насекоми.','Не консумирай. Мразовецът съдържа колхицин и е силно токсичен.','Декоративна и природонаблюдателна стойност.','Шафран се получава само от Crocus sativus, не от всеки жълт или лилав минзухар.'],
['Минзухар','Crocus sp.','Перуникови (Iridaceae)',['IMG_4460.jpg'],'Вероятно — до род','Виолетов цвят с жълто-оранжеви репродуктивни части и тесни листа.','Дивите минзухари са представени в България в различни местообитания.','Други Crocus и мразовец (Colchicum).','Ранен цветен ресурс за опрашители.','Не берете и не консумирайте без сигурно определяне; мразовецът е силно токсичен.','Декоративна и природонаблюдателна стойност.','При различните видове листата и цветовете може да се развиват по различно време.'],
['Чемерика','Helleborus sp., вероятно H. odorus','Лютикови (Ranunculaceae)',['IMG_4479.jpg'],'Вероятно','Увиснали зеленикаво-жълти цветове с многобройни тичинки и длановидно разделени листа.','Гори и храсталаци в България.','Други Helleborus, включително градински хибриди.','Ранноцъфтящ ресурс за активни в хладно време опрашители.','Токсична при поглъщане; сокът може да дразни кожа и лигавици. Пази от деца и домашни животни.','Декоративна употреба в сенчести градини.','Видимите цветни части са дълготрайни чашелистчета, не истински венчелистчета.'],
['Медуница','Pulmonaria sp.','Грапаволистни (Boraginaceae)',['IMG_4754.jpg'],'Вероятно — до род','Сини до виолетови цветове, част от пъпките са розови; листата са грапави.','Сенчести гори и горски окрайнини.','Други видове Pulmonaria.','Ранен нектарен ресурс за пчели и други опрашители.','Няма достатъчно научно потвърдени данни за безопасна лечебна доза при вътрешна употреба.','Традиционно е използвана при дихателни оплаквания; това не е клинично доказано лечение.','Промяната от розово към синьо съпътства развитието на цвета.'],
['Червена гълъбка','Russula sp. — вероятно','Гъби',['IMG_5211.jpg'],'Неопределимо','Червеникава шапка и светли пластинки в листна постеля; точният вид не се установява.','Горска почва и листна постеля.','Много Russula и други пластинести гъби.','Много горски гъби участват в микоризни взаимоотношения с дървета.','НЕ КОНСУМИРАЙ. Точният вид и ядливост не могат да се установят от снимката.','Само фотографско наблюдение.','При много Russula пластинките са крехки и се чупят лесно.'],
['Оранжева лилейка','Hemerocallis sp., вероятно H. fulva/градински хибрид','Асфоделови (Asphodelaceae)',['IMG_5214.jpg'],'Вероятно','Оранжеви фуниевидни цветове на високи цветоноси и дълги ремъковидни листа.','Често отглеждано декоративно растение.','Lilium и други сортове Hemerocallis.','Декоративна стойност; цветовете се посещават от насекоми.','Сериозно токсична за котки; не допускай гризане на която и да е част.','Декоративно градинско растение.','Името Hemerocallis означава „красота за ден“ — отделният цвят трае обикновено един ден.'],
['Бодил','Cirsium sp.','Сложноцветни (Asteraceae)',['IMG_5496.jpg'],'Вероятно — до род','Пурпурна кошничка, бодливи листа и прицветници.','Сухи, открити и нарушени места; бодилите са чести в България.','Carduus, Cirsium и други бодливи сложноцветни.','Ценен нектарен ресурс за пеперуди, пчели и други насекоми.','Бодлите могат да причинят механични наранявания.','Екологична и декоративна стойност.','Кошничката е съставена от множество дребни цветове.'],
['Фий','Vicia sp.','Бобови (Fabaceae)',['IMG_5503.jpg'],'Вероятно — до род','Перести листа с тесни листчета и мустачки; бледолилави пеперудоцветни цветове.','Ливади, крайпътни места и горски окрайнини.','Други Vicia, Lathyrus и Astragalus.','Бобовите растения участват в азотния цикъл и са полезни за опрашители.','Не консумирай диви семена: някои Vicia са неподходящи или токсични в значителни количества.','Някои видове се използват за фураж, но това не важи автоматично за всеки див вид.','Мустачките са преобразувани части на листа.'],
['Напръстник','Digitalis sp., вероятно D. grandiflora','Живеничеви (Plantaginaceae)',['IMG_5504.jpg'],'Вероятно','Високо класовидно съцветие с жълтеникави камбанковидни цветове с тъмни петна отвътре.','Горски окрайнини и тревисти места; вероятният вид е местен за България.','Други Digitalis.','Посещава се от едри опрашители, включително земни пчели.','СИЛНО ТОКСИЧЕН при поглъщане. Сърдечните гликозиди могат да причинят опасни нарушения на ритъма при хора и животни.','Декоративна и научна стойност; не прави чайове или извлеци у дома.','Лекарствата от рода Digitalis се използват само като строго дозирани фармацевтични продукти.'],
['Конопена водна конопка','Eupatorium cannabinum','Сложноцветни (Asteraceae)',['IMG_5505.jpg'],'Вероятно','Рехави розоволилави съцветия и срещуположни, често триделни листа.','Влажни гори, край реки и сенчести храсталаци.','Други Eupatorium и сродни сложноцветни.','Посещава се от пеперуди, пчели и други насекоми.','Не използвай вътрешно без надежден източник и медицинска консултация.','Традиционната употреба не е равна на доказана терапия.','Въпреки името не е ботанически свързана с истинския коноп.'],
['Калина','Viburnum sp.','Adoxaceae',['IMG_5506.jpg'],'Вероятно — до род','Бели дребни цветове в разклонени съцветия и срещуположни елиптични листа.','Храсталаци и горски окрайнини; родът е представен в България.','Други Viburnum.','Цветовете привличат насекоми; плодовете на част от видовете са ресурс за птици.','Не консумирай плодове или други части без точно видово определяне.','Декоративни храсти за природни градини и живи плетове.','При някои калини плодовете сменят цвят по време на узряването.'],
['Слива','Prunus sp.','Розоцветни (Rosaceae)',['IMG_5510.jpg'],'Вероятно — до род','Зелени продълговати костилкови плодове и назъбени елиптични листа.','Култивирани и подивели сливи са широко разпространени.','Prunus domestica, P. cerasifera, P. spinosa и други сливи.','Плодовете са храна за животни, а цветовете се посещават от опрашители.','Не яж костилки: съдържат цианогенни съединения.','При сигурно определени култивирани сливи: прясна консумация, сушене, компоти и конфитюри.','Сините сливи са сушени плодове от подходящи сортове сливи.'],
['Вечнозелен храст','Phillyrea sp. — вероятно','Маслинови (Oleaceae)',['IMG_5511.jpg'],'Неопределимо','Кожести елиптични листа и неузрели дребни плодове; не се виждат цветове.','Топли, сухи храсталачни местообитания са възможни за рода.','Phillyrea, Myrtus, Olea и други вечнозелени храсти.','Дава укритие на дребни животни; плодовете могат да са ресурс за птици.','Не консумирай плодовете без точно определяне.','Потенциална декоративна стойност за сухи и топли места.','Ако е Phillyrea, родът е от семейство Маслинови, както маслината и ясена.'],
['Дъб','Quercus sp.','Букови (Fagaceae)',['IMG_5513.jpg'],'Неопределимо','Масивно многостволно дърво с широка корона; липсват достатъчно листа и плодове за вид.','Дъбовете са ключови местни дървета в българските гори.','Различни Quercus.','Осигуряват местообитания, жълъди и укрития за множество организми.','Големи количества жълъди и листа могат да са рискови за добитък поради танини.','Дървесина, сянка, почвозащита и възстановяване на местообитания.','Старите дъбове поддържат много биоразнообразие чрез кора, хралупи и мъртва дървесина.'],
['Обикновен олеандър','Nerium oleander','Apocynaceae',['IMG_5520.jpg'],'Потвърдено с висока вероятност','Тесни кожести листа и многобройни розови петделни цветове.','Декоративен храст в по-топли райони и дворове.','Декоративни сортове на същия вид.','Декоративна стойност; в подходящи условия се посещава от насекоми.','ВСИЧКИ ЧАСТИ СА СИЛНО ОТРОВНИ за хора и животни. Не изгаряй клонки за готвене.','Само декоративна употреба при безопасно разположение.','Устойчивостта на суша обяснява широката употреба в средиземноморското озеленяване.'],
['Бодлив залист','Ruscus sp.','Асфоделови (Asparagaceae)',['IMG_5536.jpg'],'Вероятно — до род','Твърди, заострени листоподобни органи по разклонено растение в подлеса.','Сенчести гори и храсталаци в по-топлите части на България.','Ruscus aculeatus, Ruscus hypoglossum и други подлесни видове.','Създава вечнозелено укритие в подлеса.','Бодливите върхове могат да нараняват; не приемай плодове или корени за самолечение.','Декоративна флористична употреба.','„Листата“ са преобразувани стъбла, наречени кладодии.'],
['Бугенвилея','Bougainvillea sp.','Nyctaginaceae',['IMG_5547.jpg'],'Потвърдено до род','Яркомагентените части са прицветници; истинските цветове са дребни и светли в центъра.','Отглежда се като саксийно или градинско растение в защитени топли условия.','Други сортове и хибриди Bougainvillea.','В топъл климат цветните прицветници могат да привличат насекоми.','Бодливите клонки могат да наранят; сокът може да раздразни кожа.','Саксии, фасади и перголи в защитени топли места.','Най-ярките „цветове“ са прицветници, а не истински цветове.'],
['Орлови нокти','Lonicera sp.','Caprifoliaceae',['IMG_5550.jpg'],'Вероятно — до род','Срещуположни елиптични листа и яркочервени плодове по двойки/малки групи.','В България има диви и декоративни видове.','Други Lonicera и храсти с червени плодове.','Цветовете на много видове са ресурс за опрашители; плодовете може да се поемат от птици.','Не яж плодовете: много видове могат да причинят стомашно-чревни оплаквания.','Декоративни храсти и живи плетове.','Срещуположните листа са полезен определителен белег за рода.'],
['Тлъстига','Sempervivum sp.','Дебелецови (Crassulaceae)',['IMG_5633.jpg'],'Вероятно — до род','Сочни листа в розетка, месесто стъбло и звездовидни розово-червени цветове.','Сухи, каменисти места, скали и стари зидове.','Други Sempervivum и Jovibarba.','Подходяща за бедни сухи почви; цветовете се посещават от насекоми.','Няма достатъчно данни за безопасна вътрешна употреба.','Алпинеуми, сухи зидове и зелени покриви.','Sempervivum означава „винаги жив“.'],
['Огнен трън','Pyracantha coccinea','Розоцветни (Rosaceae)',['IMG_5736.jpg'],'Вероятно','Гъсти гроздове от дребни оранжеви плодове с тъмна звездовидна чашка.','Широко използван декоративен храст.','Cotoneaster и Sorbus; Pyracantha обикновено има бодливи клонки.','Плодовете са зимен ресурс за птици, а бодливата корона дава укритие.','Плодовете не се препоръчват за консумация; бодлите могат да нараняват.','Декоративни и защитни живи плетове.','Pyracantha означава „огнен бодил“.'],
['Синя усойница','Echium sp., вероятно E. vulgare','Грапаволистни (Boraginaceae)',['IMG_5759.jpg'],'Вероятно','Изправено грубовлакнесто стъбло със синьо-виолетови цветове и розово-виолетови пъпки.','Сухи тревисти места, крайпътища и горски окрайнини.','Други Echium и представители на Boraginaceae.','Добър нектарен ресурс за пчели, земни пчели и пеперуди.','Грубите власинки могат да дразнят кожата. Не приемай вътрешно: в рода са известни пиролизидинови алкалоиди с потенциален чернодробен риск.','Подходяща за диви и опрашителни градини само при сигурно определяне.','При много Echium пъпките са розови, а отворените цветове посиняват.']
];let n=0,photo=0;const sc=s=>s.startsWith('Потвърдено')?'badge':s.startsWith('Неопределимо')?'badge unc':'badge prob';function menu(){list.innerHTML=P.map((p,i)=>`<button class="plant-btn ${i===n?'active':''}" onclick="openPlant(${i})">${p[0]}<br><small>${p[1]}</small></button>`).join('')}function openPlant(i){n=i;photo=0;menu();draw()}function change(d){let a=P[n][3];photo=(photo+d+a.length)%a.length;draw()}function draw(){let p=P[n],a=p[3],multi=a.length>1;view.innerHTML=`<article class="layout"><div><img class="photo" src="${a[photo]}" alt="${p[0]}">${multi?`<div class="gallery"><button onclick="change(-1)">← Предишна снимка</button><span>${photo+1} / ${a.length}</span><button onclick="change(1)">Следваща снимка →</button></div>`:''}</div><div class="info"><h2>${p[0]}</h2><div class="latin">${p[1]}</div><span class="${sc(p[4])}">${p[4]}</span><div class="meta"><div><b>Семейство</b>${p[2]}</div><div><b>Статус</b>Наблюдаван образец</div></div><h3>Разпознаване</h3><p>${p[5]}</p><p><b>Местообитание и разпространение:</b> ${p[6]}</p><p><b>Възможни двойници:</b> ${p[7]}</p><h3>Ползи</h3><p>${p[8]}</p><h3>Вреди и рискове</h3><p>${p[9]}</p><h3>Употреби</h3><p>${p[10]}</p><h3>Любопитен факт</h3><p>${p[11]}</p><div class="note"><b>Забележка за точност:</b> При „Вероятно“ и „Неопределимо“ липсват един или повече диагностични белези. Не използвай записа за ядливост, самолечение или бране от природата.</div><div class="sources"><b>Източници:</b> ${src}</div></div></article>`}menu();draw();
</script></body></html>
