<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Флора — ботанически каталог</title>
<style>
:root{--g:#285c38;--p:#fbf8f1;--i:#1c2a20;--l:#d8d1c3;--m:#667067}*{box-sizing:border-box}body{margin:0;background:#edf1eb;color:var(--i);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--g);color:white;padding:22px max(18px,calc((100vw - 1200px)/2))}h1{margin:0;font:700 30px Georgia,serif}header p{margin:4px 0 0;opacity:.88}main{max-width:1200px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:270px 1fr;gap:22px}aside,.card{background:var(--p);border:1px solid var(--l);border-radius:15px;box-shadow:0 5px 18px #23331b12}aside{padding:12px;height:max-content;position:sticky;top:16px}.plant-btn{display:block;width:100%;border:0;border-radius:9px;background:transparent;color:var(--i);padding:10px;text-align:left;cursor:pointer;font:inherit}.plant-btn:hover,.plant-btn.active{background:#dcebdc;color:#174425;font-weight:700}.card{overflow:hidden}.layout{display:grid;grid-template-columns:minmax(280px,43%) 1fr}.photo{width:100%;height:480px;object-fit:cover;background:#dde4dc}.info{padding:28px}.latin{font:italic 20px Georgia,serif;color:var(--g);margin:3px 0 15px}h2{font:700 31px Georgia,serif;margin:0}h3{font:700 18px Georgia,serif;color:var(--g);margin:18px 0 4px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-block:1px solid var(--l);padding:12px 0;margin:15px 0}.meta b{display:block;color:var(--m);font-size:12px}.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:#edf4ed;color:#245d36;font-size:12px;font-weight:700}.prob{background:#fff0d9;color:#8a4c00}.unc{background:#fde3e3;color:#8a2626}.gallery{display:flex;justify-content:center;align-items:center;gap:9px;padding:11px;border-top:1px solid var(--l);background:#f5f0e6}.gallery button{border:1px solid var(--l);border-radius:8px;background:white;padding:7px 10px;cursor:pointer;font-weight:600}.gallery span{font-size:13px;color:var(--m)}.notice{margin-top:18px;padding:11px 13px;background:#fff3dc;border-left:4px solid #d88b18;border-radius:6px;font-size:14px}.source{margin-top:18px;padding-top:10px;border-top:1px solid var(--l);font-size:12px;color:var(--m)}@media(max-width:780px){main{grid-template-columns:1fr}aside{position:static}.layout{grid-template-columns:1fr}.photo{height:370px}.info{padding:20px}}
</style></head><body>
<header><h1>Дигитален ботанически хербарий</h1><p>Флора на България и декоративни растения</p></header>
<main><aside><strong>Каталог</strong><div id="list"></div></aside><section id="view" class="card"></section></main>
<script>
const P=[
['Лютиче','Ranunculus sp.','Лютикови (Ranunculaceae)',['IMG_1759.jpg'],'Вероятно','Лъскав жълт цвят с пет венчелистчета и много тичинки. Листата не позволяват сигурно определяне до вид.','Пресните лютичета могат да съдържат дразнещи вещества; не са за консумация.'],
['Прегоряла орхидея','Neotinea ustulata','Орхидеи (Orchidaceae)',['IMG_1766.jpg'],'Вероятно','Компактно съцветие с тъмни връхни пъпки и розово-пурпурни цветове.','Не бере и не изкопавай диви орхидеи.'],
['Теснолистна върбовка','Epilobium angustifolium','Върбовкови (Onagraceae)',['IMG_2214.jpg','IMG_5641.jpg'],'Потвърдено','Високи стъбла, тесни листа и дълги гроздове от пурпурнорозови цветове; видът колонизира сечища и нарушени терени.','Традиционната употреба като чай не е клинично доказано лечение.'],
['Алпийски еделвайс','Leontopodium nivale subsp. alpinum','Сложноцветни (Asteraceae)',['IMG_2372.jpg','IMG_2373.jpg'],'Вероятно','Сребристо-влакнеста розетка и мъхесто звездовидно съцветие; високопланински облик.','Не събирай диви екземпляри.'],
['Пластинеста гъба с пръстен','Неидентифицирана гъба','Гъби',['IMG_3284.jpg'],'Неопределимо','Виждат се шапка, пластинки, пънче и пръстен, но не и достатъчно белези за определяне.','НЕ КОНСУМИРАЙ. Гъбите не са растения.'],
['Жълт минзухар','Crocus sp.','Перуникови (Iridaceae)',['IMG_4387.jpg'],'Вероятно','Жълт бокаловиден цвят с шест околоцветни дяла.','Не консумирай; не бъркай с мразовец (Colchicum).'],
['Минзухар','Crocus sp.','Перуникови (Iridaceae)',['IMG_4460.jpg'],'Вероятно','Виолетов цвят с жълто-оранжеви репродуктивни части.','Не консумирай; видът не е определен.'],
['Чемерика','Helleborus sp.','Лютикови (Ranunculaceae)',['IMG_4479.jpg'],'Вероятно','Увиснали зеленикаво-жълти цветове и длановидно разделени листа.','Токсична при поглъщане; пази деца и домашни животни.'],
['Медуница','Pulmonaria sp.','Грапаволистни (Boraginaceae)',['IMG_4754.jpg'],'Вероятно','Сини до виолетови цветове с розови пъпки и грапави листа.','Няма достатъчно данни за безопасна лечебна вътрешна употреба.'],
['Червена гълъбка','Russula sp. — вероятно','Гъби',['IMG_5211.jpg'],'Неопределимо','Червеникава шапка и светли пластинки в листна постеля.','НЕ КОНСУМИРАЙ. Гъбите не са растения.'],
['Оранжева лилейка','Hemerocallis sp.','Асфоделови (Asphodelaceae)',['IMG_5214.jpg'],'Вероятно','Оранжеви фуниевидни цветове и дълги ремъковидни листа.','Сериозно токсична за котки.'],
['Бодил','Cirsium sp.','Сложноцветни (Asteraceae)',['IMG_5496.jpg'],'Вероятно','Пурпурна кошничка и силно бодливи листа.','Бодлите могат да причинят наранявания.'],
['Фий','Vicia sp.','Бобови (Fabaceae)',['IMG_5503.jpg'],'Вероятно','Перести листа с мустачки и лилави пеперудоцветни цветове.','Не консумирай диви семена без сигурно определяне.'],
['Напръстник','Digitalis sp.','Живеничеви (Plantaginaceae)',['IMG_5504.jpg'],'Вероятно','Високо съцветие с жълтеникави камбанковидни цветове с петна отвътре.','СИЛНО ТОКСИЧЕН при поглъщане за хора и животни.'],
['Конопена водна конопка','Eupatorium cannabinum','Сложноцветни (Asteraceae)',['IMG_5505.jpg'],'Вероятно','Рехави розоволилави съцветия и често триделни срещуположни листа.','Не използвай вътрешно като самолечение.'],
['Калина','Viburnum sp.','Adoxaceae',['IMG_5506.jpg'],'Вероятно','Бели дребни цветове в разклонени съцветия и срещуположни листа.','Не консумирай части от неустановен вид.'],
['Слива','Prunus sp.','Розоцветни (Rosaceae)',['IMG_5510.jpg'],'Вероятно','Зелени костилкови плодове и назъбени елиптични листа.','Не яж костилки; съдържат цианогенни съединения.'],
['Вечнозелен храст','Phillyrea sp. — вероятно','Маслинови (Oleaceae)',['IMG_5511.jpg'],'Неопределимо','Кожести елиптични листа и дребни неузрели плодове.','Не консумирай плодовете без точно определяне.'],
['Дъб','Quercus sp.','Букови (Fagaceae)',['IMG_5513.jpg'],'Неопределимо','Широка корона и масивно дърво; не се виждат достатъчно листа и плодове за вид.','Големи количества жълъди могат да са рискови за добитък.'],
['Обикновен олеандър','Nerium oleander','Apocynaceae',['IMG_5520.jpg'],'Потвърдено','Тесни кожести листа и многобройни розови цветове.','ВСИЧКИ ЧАСТИ СА СИЛНО ОТРОВНИ.'],
['Бодлив залист','Ruscus sp.','Асфоделови (Asparagaceae)',['IMG_5536.jpg'],'Вероятно','Твърди, заострени листоподобни кладодии в горски подлес.','Бодливите върхове могат да нараняват.'],
['Бугенвилея','Bougainvillea sp.','Nyctaginaceae',['IMG_5547.jpg'],'Потвърдено до род','Ярките магентени части са прицветници, а истинските цветове са дребни.','Бодливите клонки и сокът могат да дразнят.'],
['Орлови нокти','Lonicera sp.','Caprifoliaceae',['IMG_5550.jpg'],'Вероятно','Срещуположни листа и яркочервени плодове.','Не яж плодовете.'],
['Тлъстига','Sempervivum sp.','Дебелецови (Crassulaceae)',['IMG_5633.jpg'],'Вероятно','Сочни листа в розетка и звездовидни розово-червени цветове.','Няма доказана безопасна вътрешна употреба.'],
['Огнен трън','Pyracantha coccinea','Розоцветни (Rosaceae)',['IMG_5736.jpg'],'Вероятно','Гъсти гроздове от дребни оранжеви плодове и бодлив храст.','Плодовете не се препоръчват за консумация; бодлите нараняват.'],
['Синя усойница','Echium sp.','Грапаволистни (Boraginaceae)',['IMG_5759.jpg'],'Вероятно','Грубовлакнесто стъбло със синьо-виолетови цветове и розови пъпки.','Не приемай вътрешно; в рода са известни пиролизидинови алкалоиди.']
];
let n=0,photo=0;const statusClass=s=>s==='Потвърдено'||s==='Потвърдено до род'?'badge':s==='Неопределимо'?'badge unc':'badge prob';
function menu(){list.innerHTML=P.map((p,i)=>`<button class="plant-btn ${i===n?'active':''}" onclick="openPlant(${i})">${p[0]}<br><small>${p[1]}</small></button>`).join('')}
function openPlant(i){n=i;photo=0;menu();draw()}function change(d){let a=P[n][3];photo=(photo+d+a.length)%a.length;draw()}
function draw(){let p=P[n],a=p[3],multiple=a.length>1;view.innerHTML=`<article class="layout"><div><img class="photo" src="${a[photo]}" alt="${p[0]}">${multiple?`<div class="gallery"><button onclick="change(-1)">← Предишна снимка</button><span>${photo+1} / ${a.length}</span><button onclick="change(1)">Следваща снимка →</button></div>`:''}</div><div class="info"><h2>${p[0]}</h2><div class="latin">${p[1]}</div><span class="${statusClass(p[4])}">${p[4]}</span><div class="meta"><div><b>Семейство</b>${p[2]}</div><div><b>Статус</b>Наблюдаван образец</div></div><h3>Разпознаване</h3><p>${p[5]}</p><h3>Рискове и важна бележка</h3><p>${p[6]}</p><h3>Екологична роля</h3><p>Наблюдаваният вид е част от местни или декоративни растителни съобщества; точната роля зависи от сигурното определяне до вид.</p><div class="notice"><b>Забележка за точност:</b> Записите „Вероятно“ и „Неопределимо“ не следва да се използват за определяне на ядливост, самолечение или събиране от природата.</div><div class="source"><b>Източници:</b> Plants of the World Online (Kew Science); проверка на разпространението чрез български флористични източници; специализирани токсикологични източници за рисковите видове.</div></div></article>`}menu();draw();
</script></body></html>
